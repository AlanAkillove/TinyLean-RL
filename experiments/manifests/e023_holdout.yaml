  primary_eval_host: "fly122 for all four checkpoints"
  final_layout: "primary seed1/seed3 live at e023_holdout_seed{1,3}_fly122.json; the plain e023_holdout_seed1.json path still holds the fly90 cross-device sensitivity run (byte-identical copy also at ..._fly90_crossdevice.json); the analyzer was invoked with explicit --theta0/--seed1/--seed2/--seed3 paths"
  unchanged: [sealed holdout (128, selection_seed 20260918), sampling protocol, seed schedule, verifier semantics, theorem 38 retained]

