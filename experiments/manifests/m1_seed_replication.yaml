# M1 seed replication - pre-registration (Phase 2 of the unattended batch).
# Frozen BEFORE any replicate run; the seed values and the analysis rules below
# must not change based on results (no outcome-dependent seed selection).
audit: docs/seed_control_audit.md

seeds:
  seed2: 20260918    # runs/m1_seed2, scripts/run_m1_seed2.sh
  seed3: 20260919    # runs/m1_seed3, only if seed2 completes and the host is stable

seed_knobs:
  +data.seed: "dataloader shuffle generator (main_ppo.py:368); the only configurable seed in this pinned build"
  rollout_engine_seed: "NOT configurable on the FSDP path (RolloutConfig has no seed field; vLLM engine seed fixed at 0) - independence comes from the diverging request streams, verified by the live sanity check"
  seed1_effective_defaults: {data.seed: 1}

recipe: "identical to E019/P3-B (GRPO/DrGRPO, FULL-FT, n=8, tb4, lr 2e-6, no KL, multiturn off, 4096)"

rules:
  - fresh start from Kimina-Prover-Distill-0.6B (never from theta30/theta60)
  - run the full 60 steps unless an unattended stop condition triggers
    (NaN/OOM/corruption/storage) - no stopping on low reward or low IGR
  - live sanity after step 1: statement sequence must differ from seed1
    (otherwise stop: seed plumbing invalid)
  - primary analysis of replicates is TRAINING DYNAMICS (IGR/Z/O/score by range);
    the reused P3-C development set is not used to pick a "best" seed

expected_artifacts:
  dynamics: experiments/results/e020_seed2_dynamics.json (via scripts/rollout_dynamics.py --dir)
  trainer_metrics: experiments/results/e020_seed2_trainer_metrics.json
  checkpoints: runs/m1_seed2/global_step_30, global_step_60 (export to runs/m1_seed2_models)

outcome_seed2:                 # completed 2026-09-18 01:39 UTC
  steps: "60/60, exit 0, wall 2:18:10 (~2.30 GPU-h at ~138 s/step)"
  live_sanity: "step-1 statement sequence disjoint from seed1 (overlap 0)"
  dynamics:
    1-10:  {igr: 0.150, score: 0.0437}
    11-20: {igr: 0.050, score: 0.0437}
    21-30: {igr: 0.175, score: 0.0750}
    31-40: {igr: 0.150, score: 0.0844}
    41-50: {igr: 0.250, score: 0.1437}
    51-60: {igr: 0.125, score: 0.0563}
    all:   {igr: 0.150, score: 0.0745}
  findings: >
    Overall magnitude replicates (IGR 0.150 vs seed1 0.158). The rise-to-
    informative-frontier-then-late-decline shape appears in BOTH seeds (the
    final segment is below each seed's own peak), but the peak LOCATION is
    seed-dependent (seed1 21-30, seed2 41-50): the '21-30 peak then
    regression' is not a fixed cross-seed pattern. Descriptive only - two
    training seeds cannot support seed-level significance claims.
  checkpoint_notes: >
    step60 exported bitwise-identical (rel_L2 vs base 2.41e-4, same magnitude
    as seed1's 2.35e-4). Actor weights of steps 10/20/30 were pruned by
    max_actor_ckpt_to_keep=3 (only step60 is needed by the final holdout;
    dynamics come from rollout dumps and are unaffected).

seed3_decision: pending    # run only if the host stays stable; same rules as seed2
