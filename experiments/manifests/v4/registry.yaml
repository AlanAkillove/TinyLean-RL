experiments:
  V4-P001:
    title: "Paired verifier-guided repairability probe (FRESH_RETRY / SELF_REVISION / VERIFIER_REPAIR / MISMATCHED_DIAGNOSTIC)"
    status: PREREGISTERED
    owner: fly90 (coordination) + fly122 (formal host)
    authorization: "owner directive 'TinyLean-RL enters V4' §A-§S, 2026-09-25; owner review of the preregistration, 2026-09-25 (Amendment A)"
    research_question: >
      Given a Lean-level failed proof produced by frozen Kimina-Distill-0.6B theta0, does the exact
      Lean verifier diagnostic improve second-attempt proof success beyond (A) a fresh retry and
      (B) self-revision without the diagnostic, and is any such gain specific to *this* theorem's
      diagnostic (D, a real diagnostic of a different theorem, assigned by a frozen derangement)?
    design:
      unit: theorem (family component), one representative per component
      arms: [A_FRESH_RETRY, B_SELF_REVISION, C_VERIFIER_REPAIR, D_MISMATCHED_DIAGNOSTIC]
      arm_d_role: "falsification / mechanism only; it does not enter the GO gate and does not replace the C-A and C-B primary questions"
      pairing: common random numbers; one shared seed per formal rank across all four arms
      arm_order: "balanced schedule over the 128 formal ranks (frozen before second-stage generation)"
      success: canonical score == 1 under the same format-gated Lean verification in all arms
      primary_endpoints: [mean(C-A), mean(C-B)]
      specificity_endpoint: "mean(C-D), directional rule without an effect-size threshold, reported as a mechanism label"
      descriptive_endpoints: [mean(B-A), error transitions for B/C/D]
      statistics: "one-sided exact paired McNemar + paired theorem bootstrap 95% CI (10000 reps, frozen seed)"
      guards: "N_complete < 103 => D_INCONCLUSIVE_BY_DATA; censoring_range > 0.05 => D_INCONCLUSIVE_BY_DIFFERENTIAL_CENSORING; the GO taxonomy is not evaluated when either guard fails"
      guard_order: [provenance, n_complete_guard, differential_censoring_guard, primary_gates, specificity_analysis, mechanism_and_descriptive]
      outcome_taxonomy: [A_VERIFIER_SPECIFIC_GO, B_SELF_REVISION_ONLY, C_NO_REPAIR_GAIN, D_INCONCLUSIVE_BY_DATA, D_INCONCLUSIVE_BY_DIFFERENTIAL_CENSORING]
      mechanism_labels: [DIAGNOSTIC_SPECIFIC, DIAGNOSTIC_NONSPECIFIC, NOT_EVALUABLE]
      mechanism_label_rule: "DIAGNOSTIC_SPECIFIC iff mean(C-D) > 0, exact one-sided McNemar p <= 0.05 and the paired bootstrap CI lower bound > 0; appended to, never merged with, the classification"
      diagnostic_derangement:
        version: v4-derange-1
        rule: "group by frozen error category; within a category of size >= 2 order by (token-length bucket, sha256(statement_id)) and shift cyclically by one; a singleton category takes the closest-token-length-bucket donor by sha256(statement_id), avoiding the recipient and already-used fallback donors"
        invariants: [no_self_diagnostic, every_recipient_assigned_exactly_once, all_recipients_distinct]
        frozen_before: "second-stage generation; the mapping itself is computed inside the Stage-1/Stage-2 freeze boundary together with mapping_sha256"
      sensitivity: "infra-censored arms read as failures, reported separately for C-A / C-B / C-D, never redefining the primary endpoint"
    artifacts:
      pool: experiments/manifests/v4/v4_p001_pool.json
      seeds: experiments/manifests/v4/v4_p001_seeds.json
      arm_schedule: experiments/manifests/v4/v4_p001_arm_schedule.json
