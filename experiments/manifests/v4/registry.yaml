experiments:
  V4-P001:
    title: "Paired verifier-guided repairability probe (FRESH_RETRY / SELF_REVISION / VERIFIER_REPAIR)"
    status: PREREGISTERED
    owner: fly90 (coordination) + fly122 (formal host)
    authorization: "owner directive 'TinyLean-RL enters V4' §A-§S, 2026-09-25"
    research_question: >
      Given a Lean-level failed proof produced by frozen Kimina-Distill-0.6B theta0, does the exact
      Lean verifier diagnostic improve second-attempt proof success beyond (A) a fresh retry and
      (B) self-revision without the diagnostic?
    design:
      unit: theorem (family component), one representative per component
      arms: [A_FRESH_RETRY, B_SELF_REVISION, C_VERIFIER_REPAIR]
      pairing: common random numbers; one shared seed per formal rank across the three arms
      success: canonical score == 1 under the same format-gated Lean verification in all arms
      primary_endpoints: [mean(C-A), mean(C-B)]
      descriptive_endpoint: mean(B-A)
      statistics: "one-sided exact paired McNemar + paired theorem bootstrap 95% CI (10000 reps, frozen seed)"
      data_guard: "complete triplets < 103 => INCONCLUSIVE_BY_DATA; the GO taxonomy is not applied"
      outcome_taxonomy: [A_VERIFIER_SPECIFIC_GO, B_SELF_REVISION_ONLY, C_NO_REPAIR_GAIN, D_INCONCLUSIVE_BY_DATA]
    artifacts:
      pool: experiments/manifests/v4/v4_p001_pool.json
