fixed_set_naming: >
  In write-ups call it a "held-out-from-pilot, same-source fixed set" (or "pilot-unseen
  Promptset fixed set"): it excludes every statement used by E009/E013/E016/E017 in this
  project, but it is NOT an OOD set (the distill model's training data may contain these
  theorems) and NOT a strict same-distribution test set (the dataset deliberately
  reweights hard problems; the 64 theorems were drawn uniformly from 7470 eligible
  unique statements).

inference_weight: >
  Primary comparison: theta30 vs theta0 (most consistent verifier environment).
  theta10: auxiliary timepoint. theta20: keep it in the checkpoint curve but mark it
  "minor verifier-instance environment deviation" (freshly initialized server instance,
  effective 40 GiB cap); do not load key causal conclusions onto it.

incidents:                   # full narrative in docs/experiment_log.md E018
  - verify fallback storm: one 128-candidate /verify request timing out degraded to 128
    sequential single retries (17.8 min/chunk); fixed in 1fb6866 (concurrent sub-batches).
  - host OOM chain: REPL memory explosions (interval_cases enumeration bombs, one REPL at
    20.4 GB RSS) triggered kernel OOM + systemd-oomd user-slice kills, aborting four step20
    attempts; fixed in d64c31b (container mem cap). step20 ran with an effective 40 GiB cap;
    restored to 24 GiB after the run (docker update, no recreate).
  - environment delta, recorded for honesty: step0/step10/step30 were evaluated on the
    long-lived server instance; step20 ran on a freshly-initialized instance (container was
    recreated at 07:33 UTC while applying the cap, which re-ran the image's Mathlib
    initialization; ~25 min, during which every /verify fails). verifier_error rates
    1.6-2.9% across all four stay within the E013-era range.

caveat: >
  A 30-update pilot evaluated on 64 theorems × 8 samples has limited power for the observed
  effect size; the sealed set must not be redrawn after seeing these numbers. Extending
  training or increasing theorem count are the only legitimate ways to sharpen the verdict.

next_options:
  - extend training past step30 (target step60) and re-evaluate ONLY step60 on the SAME
