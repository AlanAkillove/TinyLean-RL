# Canonical V5 experiment registry.
#
# V5 namespace (owner directive 2026-09-26, "TinyLean-RL enters V5", branch
# v5-process-verified-rl):
#   V5-P###  offline probes/audits on existing surfaces (no training, no model
#            generation).
#   V5-R###  RL-intervention experiments; created ONLY after a probe passes its
#            frozen gate AND the owner authorizes the next stage.
# V1 (E###), V2 (A/B/C), V3 and V4 identifiers are never reused. All of them are
# frozen and none of their artifacts is edited by V5.
#
# This file is append-only for experiment entries. A manifest is created and
# committed BEFORE its run and frozen per its own freeze_rule (see
# experiments/manifests/v5/V5-P001.yaml).

registry:
  created_at_utc: "2026-09-26"
  namespaces:
    V5-P###: {kind: offline-audit, default-host: fly122, scope: "process-label recoverability on frozen historical rollouts; read-only oracle, no generation"}
    V5-R###: {kind: rl-intervention, default-host: fly122, scope: "process-verified RL; NOT authorized by V5-P001 - only the drafting of an R001 preregistration is"}
  host_policy: >
    Owner directive 2026-09-26: fly122 (RTX 3080, 10 GB) hosts the dedicated process
    oracle instance `tinylean-rl-lean-oracle-v5` (pinned image digest
    sha256:588a2cbbd10da509ed13f53ac136f8463fabff02dfe4eca535e7c47ae6e3ffd9) and any
    future formal compute; fly90 is coordination/archive and CPU analysis only - it does
    NOT become a formal model-compute node. V5-P001 generates no tokens and updates no
    weights anywhere.

frozen_inherited: "V1, V2, V3 and V4 are frozen. V4-P001 stays closed at C_NO_REPAIR_GAIN / DIAGNOSTIC_NONSPECIFIC; the verifier-text repair line is not reopened."

sealed_sets_never_used:
  - id: V3-FINAL-HOLDOUT
    components: 93
    status: SEALED / NEVER USED
    manifest: experiments/manifests/v3/v3_final_holdout_reserve.json
  - id: future-family-clean-capability-holdout
    status: NOT YET DEFINED / NEVER TOUCHED BY V5
  - id: new-theorem-families
    status: NONE INTRODUCED BY V5-P001

