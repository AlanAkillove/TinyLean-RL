      seeds: [seed1, seed2, seed3]
      groups_total: 720
      labels_total: {ALL_FAIL: 603, MIXED: 110, ALL_SUCCESS: 7}
      contaminated_groups: 34
      groups_primary: 686
      labels_primary: {ALL_FAIL: 575, MIXED: 104, ALL_SUCCESS: 7}
      primary_all_fail: {groups: 575, candidates_code: 1736, candidates_sentinel: 2864,
                         by_seed: {seed1: 193, seed2: 197, seed3: 185}}
      plan: {n_planned: 5488, n_code: 2476, n_sentinel: 3012}
    estimand:
      primary: "RecoveryRate = P(PROCESS_STRUCTURED_RECOVERABLE | ALL_FAIL); unit = primary all-fail group"
      bootstrap: "10000 resamples, seed 20260926, component-family cluster, percentile 95%"
      secondary: "candidate-level rate (descriptive); per-seed, quartile and d1/d2 sensitivity views"
    gates:
      E1: "tactic -> first-generated-token mapping >= 0.95"
      E2: "conclusive oracle outcomes >= 0.90 among code-extractable non-infra candidates"
      G1: "pooled RecoveryRate >= 0.25 and CI lower bound > 0.15"
      G2: "per-seed point estimate >= 0.20 in every seed"
      G3: "> 0.15 in >= 3 of 4 length quartiles"
      classification: [PROCESS_SIGNAL_GO, NO_PROCESS_RECOVERY, PROCESS_SIGNAL_SEED_UNSTABLE,
                       PROCESS_SIGNAL_LENGTH_CONFOUNDED, INCONCLUSIVE_PROCESS_ORACLE]
    artifacts:
