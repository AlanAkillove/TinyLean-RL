  - "A2 tactic -> token mapping with the frozen Kimina tokenizer"
  - "A3 historical surface reconstruction + binary baseline (720/686, 603/110/7)"
  - "A4 analyzer, gates and result schema implemented; tests + ruff green"
  - "A5 preregistration written and frozen (THIS manifest) - historical process labels inspected = 0"
  - "A6 single Phase-A commit + push to origin + sync to fly122"
  - "A7 Amendment A (owner-approved pre-outcome): two-strike wedge censoring; attempt0 archived; fresh run dir + preflight + relaunch"
  - "B1 preflight on fly122 (oracle identity, tokenizer, fixtures, plan)"
  - "B2 process every planned candidate exactly once (2476 submissions; overnight)"
  - "B3 freeze raw items + labels; archive to fly90"
  - "B4 structural validation (24/24 fixture re-derivation, provenance)"
  - "B5 canonical analyzer run, exactly once -> V5_P001_RESULT"
  - "B6 if PROCESS_SIGNAL_GO: draft the V5-R001 preregistration only"
