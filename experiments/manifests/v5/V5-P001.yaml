reporting:
  live_metrics_during_phase_b: prohibited      # infrastructure monitoring only
  if_scientific_metric_emitted_early: STOP_FOR_OWNER
  result_schema: V5_P001_RESULT                # owner section 34 field list
  permitted_claim: "offline process-label recoverability on the frozen V1 surface only; no training, no generation, no capability or gradient claim"

