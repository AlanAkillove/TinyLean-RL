      - "deployment pool semantics were never frozen: 'uniform over 24,418 rows' was inherited, not proven from trainer source (later resolved by the deployment-pool audit: unit IS row, but the sampled population is the 1024-token-filtered 24,246 rows / 7,613 statements)"
