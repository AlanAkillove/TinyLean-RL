    changes:
      - >
        V3-R001 is REASSIGNED from the RL-training draft to "V3-R001 - Prospective Family-Clean
        Validation of the Informative-Group Controller": a frozen-theta0 ROLLOUT experiment that
        measures whether the already-frozen controller transfers to previously unseen theorem
