  - id: V2-track-C-reservation-release
    applies_to: "V2 (frozen), as seen from V3-R001"
    created_at_utc: "2026-09-24"
    kind: governance-change-in-reservation-status        # NOT a data reuse, NOT a V2 edit
    authorized_by: "owner decisions 2026-09-24 §1 - V3 prospective contamination definition = consumed_only"
    owner_statement_verbatim: >
      V2 Track C reserved families were released by owner for V3 because Track C was never executed
      and no outcomes from those families were observed. This is a governance change in reservation
      status, not a reuse of previously evaluated data.
    evidence_track_c_never_executed:
      - "no V2-C### experiment id exists anywhere under experiments/ or docs/: the V2 registry carries exactly six entries (E001, B001, B002, B003, B004, A001), and Track C appears only as the namespace declaration V2-C### {track: C, owner: fly90, scope: joint prover x allocation evaluation}."
      - "docs/v2/a001_termination_snapshot.md:84 records 'Track C: NOT RUN'."
      - "docs/v2/README.md:7 freezes V2 with 'No further checkpoint selection, adaptive-compute modeling, or confirmatory Track C experiment will be added to V2.'"
      - "the frozen pool artifact classifies the carve-out itself as reserved-never-used (usage_classes.c_joint_holdout), and its marginal-cost table reports that not excluding it returns 221 candidates."
    what_changed: >
      The V3 pool reading used for prospective eligibility moved from the strict literal §5 reading
      (owner_literal_wider_v1, 56 family components) to consumed_only (221 components), which admits
      the families that Track C had reserved but never touched. The owner's stated reason is empirical:
      reservation without generation, verification, reward, training or selection leaves nothing to
      contaminate. This is the difference between a descriptive 56-theorem study and a powered test
      (docs/v3/V3-R001_power.md §3: 0.98 expected positives in the selected block at 56, power 0.69).
    what_did_not_change: >
      Zero V2 artifacts. No V2 manifest, result, registry entry, freeze package or family-component
      registry was edited, and no V2 conclusion was restated. The release lives only in V3 provenance
      (this entry plus the formal-sample manifest), so V2 remains reproducible exactly as frozen. The
      other four pool readings and their hashes are retained unchanged as evidence of what the choice
      was worth, including the two that yield 0 components.
    capacity_freedom_it_removes: >
      Releasing Track C is the ONLY reason N=128 exists at all: every reading that also honors the
      never-executed reservations has capacity 56 or 0. It was the owner's signature, not an
      engineering choice, and no family was reclaimed silently for sample size (§5's prohibition).

  - id: V3-R001-pre-outcome-amendments
    applies_to: V3-R001
    created_at_utc: "2026-09-25"
    kind: pre-outcome-clarification            # no prospective labels existed; no frozen number moved
    marker: "PRE-OUTCOME CLARIFICATION — no prospective labels existed"
    authorized_by: "owner review 2026-09-25 (amendments A, B, C approved before the dry-run)"
    what_changed:
      amendment_A_frozen_block: >
        The pooled and within-synthetic top-20% blocks are the preregistered FROZEN memberships. The
        earlier wording "m = round(0.20 * N_analyzed)" is deprecated: it could be misread as re-taking
        the top 20% after the labels exist. Formal rule: A = analyzable theorems, B = frozen block,
        B_analyzed = A ∩ B, N = |A|, m = |B_analyzed|, K = positives in A, x = positives in
        B_analyzed, X ~ Hypergeometric(N, K, m), p = P(X >= x); within-synthetic identical with
        m_syn = |A_syn ∩ B_syn|. Invariants: membership never recomputed, never topped up from labels,
        no replacement theorem for an infra-censored one, and m_variant_if_the_block_were_recomputed
        is a descriptive disclosure that never enters a gate. Machine-readable:
        V3-R001_gate.json#frozen_block_semantics.
      amendment_B_seed_rank: >
        The generation seed no longer depends on the controller's ranking. seed = seed_base +
        (formal_sample_rank - 1) * 8 + sample_index, seed_base = 20260924, where formal_sample_rank is
        written into v3_r001_formal_sample.json as 1..128 in the artifact's already-frozen,
        outcome-free draw order (SHA256('<draw_seed>|<component_id>') ascending). Nothing was
        re-shuffled or re-sorted: the existing order was written down. Enforced in code and tests: the
        rank is independent of q_B2, q_B1, source and any outcome; changing any q moves no seed; all
        1024 seeds are distinct.
      amendment_C_verifier_execution: >
        The formal verifier runs the B0 reliability policy (VerificationSession): sequential and
        conservative, with server-side timeout, client timeout, health check, canary, infra taxonomy,
        fail-close and unresolved-infra -> censored/missing. E024's 4-worker concurrency is not used
        because a canary cannot be gated while verifications are in flight. Recorded as an
        infrastructure execution choice, NOT a treatment difference; generation science, reward
        semantics and both gates are unchanged. Accepted limitation: R001 verifier wall-clock may not
        be compared to E023's concurrent wall-clock as an exact efficiency claim.
    what_did_not_change: >
      No sample member, no block membership, no gate boundary, no attainable alpha, no taxonomy, no
      label rule, no threshold. sample_sha256, both q-vector hashes, the block hash, the 128 component
      and statement memberships, the reserve manifest and the power artifact are byte-identical to the
      preregistration commit. What moved is the two artifact FILE hashes (the sample gained the
      explicit rank field, the gate gained the semantics block) and the frozen settings hash (the seed
      formula string).
    artifact_hashes_before_after:
      v3_r001_formal_sample.json:
        before: 7b4371e1f8211c41c3e158f8a9201f28948d29befc9a8462ae5f843c851d3d88
        after:  733a699e9eeb4f1d8b130c1a87c3455a06748b66aa3909f90995f432877c6beb
      V3-R001_gate.json:
        before: b308038093e7260f7f15d774a7f428d1f913e2555e7f885b9b88d9102452a3fc
        after:  fcb700b508460f5fdaac318f7ce8e9bd56266f7aaaf07c7452d00f08d9c7ac93
      v3_final_holdout_reserve.json: unchanged (b60be381b5f64a0394691344b71cd704ed337716f0eea81ea265e05af7761568)
    scripts: [scripts/v3_r001_sample_freeze.py, scripts/v3_r001_gate.py, scripts/v3_r001_spec.py,
              scripts/v3_r001_rollout.py, scripts/v3_r001_analyze.py]
    formal_candidates_generated: 0             # nothing was generated before or during the amendments


prepreregistration_audits:                   # owner directive 2026-09-24 §17 steps 3-5: artifacts that
                                             # must exist BEFORE the new V3-R001 preregistration is
                                             # written. Read-only; none of them launches a rollout.
  V3-R001-deployment-pool-audit:
    kind: read-only-data-audit
    title: Deployment Pool Semantics of the V1 Promptset (what theorem unit did V1 actually sample?)
    status: COMPLETE                          # §17 step 3, 2026-09-24
    created_at_utc: "2026-09-24"
    script: scripts/v3_r001_pool_audit.py
    result: experiments/manifests/v3/V3-R001_deployment_pool_audit.json
    narrative: docs/v3/V3-R001_deployment_pool_audit.md
    finding: >
      The unit is the parquet ROW of the 1024-token-FILTERED dataframe (24,246 rows / 7,613 unique
      statement_ids), not the on-disk 24,418 / 7,620 that the archived draft inherited. Duplicate rows
      of a statement are byte-identical prompts, so "unique statement_id" and "deduplicated prompt"
      coincide exactly and the owner's preferred prospective unit is well-defined. The induced
      distribution over theorems is MULTIPLICITY-WEIGHTED, not uniform (mean 3.20 rows/statement in the
      pool, 11.33 among the 612 statements V1 actually rolled out), so a uniform draw over a clean
      statement pool is a change of measure that R001 must register as a covariate-shift limitation.
      7 statements have exposure probability exactly 0 and can never carry a historical label.
    sampler_replay: >
      The account is replay-confirmed, not merely read from source: re-drawing
      torch.randperm(24246, generator=manual_seed(data.get("seed",1)))[:240] over the filtered row
      order reproduces, for all three seeds (data.seed 1 / 20260918 / 20260919, the last two read from
      the run logs), exactly the 240 prompt rows V1 realized AND the same 4-theorem composition in each
      of the 180 steps. The only residual difference is within-step order, which is an artifact of
      build_records() sorting each step's group.
    labels_only_from: "V1 rollout reconstruction (v3_d001_lib.build_records), read-only"
    authorizes_next: >
      Nothing beyond §17 step 4 (building the family-clean prospective pool from these definitions).
      It does not launch a rollout, does not authorize RL, and does not modify any frozen artifact.

  V3-R001-family-clean-pool:
    kind: read-only-pool-construction
    title: Prospective Family-Clean Pool for V3-R001 (component closure, five readings, frozen hashes)
    status: COMPLETE / OWNER_DECISION_REQUIRED_ON_POOL_READING
    created_at_utc: "2026-09-24"
    script: scripts/v3_r001_pool_build.py
    tests: tests/test_v3_r001_pool_build.py
    result: experiments/manifests/v3/V3-R001_family_clean_pool.json
    narrative: docs/v3/V3-R001_family_clean_pool.md
    unit: "one family component -> one deterministic theorem representative (lexicographically
           smallest statement_id that survives the trainer's 1024-token prompt filter)"
    finding: >
      Owner §5's carve-out list, honored literally, does NOT leave enough families for §7's preferred
      N=128. Capacity by reading (one theorem per component): owner_literal 86,
      owner_literal_wider_v1 56 (primary), consumed_only 221,
      owner_literal_all_reservations_honored 0, registry_labels_maximal 0. The decisive carve-out is
      Track C's c_joint_holdout (680 statements / 504 components): releasing it alone takes the pool
      from 56 to 221, and it is the only reading that reaches N=128 - or N=192 - with one theorem per
      family. Every remaining V2 reservation honored leaves NOTHING, which is how completely V2
      partitioned the promptset for an allocator experiment that was stopped (V2-B004 = NOT RUN).
    consumed_vs_reserved_evidence: >
      Contact was checked directly, not asserted: every rollout jsonl present on this host was parsed
      through V3-D001's own prompt->statement_id path, yielding exactly the 612 labelled statements
      (smoke run and aborted r2/r3 backups add no new statements), and ZERO on-disk contact for all
      four reserved-never-used classes. Limit recorded in the artifact: the E013/E016/P3C/IGR dumps
      are no longer on this host, so their contact is accepted from the frozen family registry
      (exclusion_reasons == v1_used, 527 components) rather than re-derived.
    pool_hashes_frozen_now:                  # all five hashed BEFORE any sample and before any
                                             # rollout exists, so the owner's choice of reading
                                             # cannot be made after seeing an outcome
      owner_literal: bea0b85da4d5f05d658ae9c4482c910c583dcda9154ddde520b8498d0ab31b63
