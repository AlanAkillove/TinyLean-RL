# Canonical V3 experiment registry.
#
# V3 namespace (owner directive 2026-09-23, branch v3-jev-rl-controller):
#   V3-D###  offline decision-probe experiments (rollout data -> frozen theta0
#            representations -> shallow calibrated heads; NO RL training).
#   V3-R###  RL-intervention experiments, created ONLY after a D### passes its
#            frozen GO gate AND the owner authorizes the next stage.
# V2 (V2-A/B/C) and V1 (E###) identifiers are never reused. V2 is frozen.
#
# This file is append-only for experiment entries. A manifest is created and
# committed BEFORE its run and frozen per its own freeze_rule (see README.md
# and each experiment's *_preregistration.md).

registry:
  created_at_utc: "2026-09-23"
  namespaces:
    V3-D###: {kind: offline-probe, default-host: fly122, scope: "informative-group decision probes on frozen V1 rollouts"}
    V3-R###: {kind: rollout-validation-then-rl-intervention, default-host: fly122,
              scope: "V3-R001 = prospective family-clean validation (frozen-theta0 rollouts, NO optimizer update); a real RL intervention would be a LATER id (R002+), gated behind R001 + owner authorization"}
  host_policy: >
    Owner directive 2026-09-24 §16: fly122 (RTX 3080, 10 GB) is the V3 FORMAL compute node;
    fly90 (RTX 3090, 24 GB) is ARCHIVE-ONLY (canonical artifacts, long CPU jobs, no formal
    results). Do not auto-switch a formal experiment back to fly90 because of a memory
    problem. If a future RL run cannot preserve the logical recipe on fly122: STOP, report
    the owner, and the owner decides between renting a >=24 GB GPU and terminating.
    (The earlier `default-host: fly90` for V3-R### predates this directive and is superseded.)
  research_question: >
    Can a lightweight Jev-inspired calibrated decision model predict which Lean
    theorems will produce reward-informative RLVR (GRPO) groups, and can that
    signal later improve RLVR sample efficiency?

experiments:
  V3-D001:
    kind: offline-probe
    owner: fly90 (canonical) / fly122 (formal compute)
    status: COMPLETE               # formal offline probe run on fly122 2026-09-23; no RL
    outcome: "GO (G1 & G2 & G3) + calibration claim met; offline only, no RL launched"
    created_at_utc: "2026-09-23"
    run_completed_utc: "2026-09-23T15:29Z"
    results: "experiments/manifests/v3/V3-D001_results.json"
    memo: "docs/v3/V3-D001_memo.md"
    manifest: experiments/manifests/v3/V3-D001.yaml
    preregistration: docs/v3/V3-D001_preregistration.md
    depends_on:
      - V3-0 data/provenance audit (commit 0377745, docs/v3/data_audit.md)
      - rollout-source hash manifest (commit bafdc92, experiments/manifests/v3/v1_rollout_sources.json)
      - nested fold manifest (experiments/manifests/v3/v3_d001_folds.json)
    authorizes_next: >
      A GO on the G1-G3 ranking gate authorizes the owner to CONSIDER V3-R001;
      it does NOT itself launch any RL. §20 step 14: STOP and report the owner.
    note: >
      Offline informative-group decision probe: nested family-grouped CV over the
      686 valid V1 rollout groups; B0 prevalence / B1 handcrafted difficulty /
      B2 frozen theta0 block-18 last-token representation (primary) + block 9/27
      (robustness); L2 logistic heads; family-component bootstrap; GO/NO-GO frozen
      as G1 (dAUPRC CI>0) & G2 (top-20 enrichment>=1.75 & CI lo>1.0) & G3 (cross-seed
      2/3). B3 MLP NOT AUTHORIZED. No new RL, no new rollouts.

# ---------------------------------------------------------------------------
# Append-only amendments. Entries above are never edited or reused; later
# methodological findings are recorded here against the frozen experiment id.
amendments:
  - id: V3-D001-canonical-audit
    applies_to: V3-D001
    created_at_utc: "2026-09-24"
    kind: post-hoc-methodological-audit        # frozen gate and committed numbers untouched
    authorized_by: "owner directive 2026-09-24 Part A (A1-A5)"
    owner_decision_2026_09_24:
      received: >
        Owner review of the canonical audit (2026-09-24, 17 sections). Accepted: the pre-registered
        GO stands and the frozen gate is NOT re-opened. Changed: the main claim is narrowed to the
        wording of record below, both intervals must always be reported together, the one-sided
        p = 0.048 may not headline, and the status becomes CANONICAL_GO_WITH_QUALIFICATION.
        Also decided there: the previous V3-R001 RL-training draft is NOT approved (kept as a
        historical DRAFT / NOT-LAUNCHED design doc, no longer the next experiment); the 10 GB
        training smoke is not run; the next formal V3 experiment is the prospective family-clean
        validation documented under V3-R001 (rewrite); fly122 is formal compute, fly90 archive-only.
      scripts_untouched: "scripts/v3_d001_audit.py keeps emitting mechanical CANONICAL_GO (repro & leak & A4); the owner status is a claim-strength decision recorded here, not a recomputation."
    scripts: [scripts/v3_d001_audit.py, scripts/v3_d001_fullproc_boot.py]
    artifacts:
      audit_fly90:  experiments/manifests/v3/V3-D001_canonical_audit_fly90.json
      audit_fly122: experiments/manifests/v3/V3-D001_canonical_audit_fly122.json
      fullproc_bootstrap: experiments/manifests/v3/V3-D001_fullproc_bootstrap.json   # A3, 1000 reps
      fullproc_3rep_fly122: experiments/manifests/v3/V3-D001_fullproc_3rep_fly122.json  # cross-node determinism
      memo: docs/v3/V3-D001_canonical_audit.md
    findings:
      A1_cross_seed: >
        G3 = 2/3 on the frozen conjunctive rule (NOT 3/3 same-direction). delta-AUPRC signs
        are +/+/- (seed3 -0.01567); top20-IGR-above-fold-prevalence and B2>B1 on top20 are
        both 3/3. Mean delta-AUPRC 0.05137, median 0.0419.
      A2_leakage: "PASS 24/24, incl. bit-identical C/mu/sd/w/p under held-out feature scramble and label flip for B1 and B2 in all 5 outer folds"
      A3_full_procedure_bootstrap: >
        The committed dAUPRC CI [0.0510, 0.2415] is a fixed-OOF-prediction (evaluation-level)
        family-component bootstrap; it propagates label-sampling variability only. A post-hoc
        full-procedure variant (resample components -> rebuild grouped folds -> reselect inner-C
        -> refit -> regenerate OOF -> recompute) is reported alongside it. It is robustness
        evidence and CANNOT alter the frozen G1-G3 gate.
      A3_result:                              # 1000/1000 replicates valid, artifact sha256 5e6697ca...
        delta_AUPRC_ci95_percentile: [-0.02504, 0.23679]     # INCLUDES 0 (frozen level-1: [0.05096, 0.24145])
        delta_AUPRC_bootstrap_mean: 0.10869
        delta_AUPRC_bootstrap_median: 0.10800
        reference_recomputed_in_run: 0.14607        # == committed; matches_committed true
        bootstrap_bias_vs_reference: -0.03738       # 71.2% of replicates below the reported point estimate
        sign_consistency_fraction_delta_gt_0: 0.952 # 48/1000 replicates <= 0
        one_sided_p_delta_le_0: 0.048
        width_level1: 0.19049
        width_level2: 0.26183                       # +37%
        B2_top20_enrichment_ci95: [2.79858, 3.87505]
        B2_top20_enrichment_ge_1p75_fraction: 1.0   # 1000/1000; worst replicate 2.4546
        delta_top20_enrichment_ci95: [-0.09932, 1.08192]   # includes 0
        delta_brier_ci95: [-0.02963, 0.00415]              # includes 0; 94.3% negative
        counterfactual_if_level2_had_been_the_gating_statistic: >
          G1 would have FAILED (lower bound -0.02504 <= 0); G2 would have PASSED and more
          strongly; G3 is unaffected (per-seed direction check, not an interval). The
          conjunctive GO would therefore have been an enrichment-only GO.
        attestation: "1000/1000 replicates record folds_rebuilt=true and C_reselected=true; resampled surfaces 610-756 rows, 253-293 unique components, 75-139 positives, prevalence 0.11241-0.20182"
        provenance_note: >
          host.git_revision (1f15c8e) is sampled at artifact-WRITE time and certifies nothing about
          the executed blob (the run loaded a pre-lint working tree at 08:15, before bab2104).
          Certification is instead internal: the run re-derives B1 0.42673 / B2 0.5728 from raw
          artifacts (matches_committed=true), and the 3 replicate seeds shared with the fly122
          pre-lint run are bit-identical across nodes on every compared field.
        structural_constant_warning: >
          comparison_to_frozen_claim.gate_outcome_changed is hard-coded False in the script
          (scripts/v3_d001_fullproc_boot.py:236) and must NOT be cited as a measurement.
      A4_representation: "PASS 5/5 (theta0 weight sha verified locally; extraction never touched labels; repeated groups share representation only)"
      A5_cross_node: >
        Audit reproduced bit-identically on fly90 (RTX 3090) and fly122 (RTX 3080, formal node)
        across two git revisions; the only differing field is the recorded audit git revision.
    status: CANONICAL_GO_WITH_QUALIFICATION   # owner decision 2026-09-24 §1: LEAKAGE_AUDIT PASS +
                                             # provenance complete, but the claim is narrowed (see below)
    permitted_claim: >
      Wording of record (owner decision 2026-09-24 §14, FINAL; it supersedes both the earlier "beyond
      handcrafted difficulty features" formulation and the "prospectively motivates prediction" variant
      proposed by the auditor on 2026-09-24 - the latter is kept below only because deleting the history
      of a claim would be worse than recording it):
      "Frozen Kimina representations contain family-generalizable signal that identifies
      reward-informative RLVR groups at enrichment far above prevalence."
      Mandatory accompanying limitation, verbatim as accepted: "Their average advantage over
      handcrafted difficulty features is positive, but the full-procedure two-sided 95% interval
      includes zero."
      Why the owner's wording is the retrospective-accurate one: D001's evidence is a retrospective
      probe on historical rollouts, so no D001 sentence may assert prospective validity - that
      question is exactly what V3-R001 is preregistered to test and is still open.
    reporting_rule: >
      Binding. Whenever the B2-vs-B1 advantage is stated, BOTH intervals must be reported together:
      level-1 fixed-OOF dAUPRC +0.14607 [0.05096, 0.24145] AND level-2 full-procedure
      +0.10869 (mean) [-0.02504, 0.23679]. The one-sided replicate-sign statement
      (952/1000 replicates > 0, p = 0.048) is appendix material only and must NOT be used as the
      headline significance statement.
    permitted_claim_qualification: >
      Added by A3 and binding on how the claim above may be used. The "beyond handcrafted difficulty
      features" clause is directional-only: level-2 intervals for dAUPRC, d(top20 enrichment) and
      dBrier all include 0 (one-sided p = 0.048 / 0.061 / 0.057). What IS robust to the full-procedure
      bootstrap is B2's absolute top-20 informative-group enrichment relative to prevalence
      (1000/1000 replicates >= 1.75). The narrower wording above was adopted by the owner on
      2026-09-24 (§14) and is the wording of record; prospective validity is not claimed here at all,
      it is the open question V3-R001 is preregistered to answer.
    not_permitted: ["controller improves RL", "controller improves theorem proving", "controller saves compute"]

  - id: V3-R001-id-reassignment-and-host-policy
