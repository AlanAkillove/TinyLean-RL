  - id: V3-D001-a3-cross-host-replication
    applies_to: [V3-D001]
    created_at_utc: "2026-09-24"
    kind: robustness-replication              # re-runs an ALREADY-COMPUTED post-hoc bootstrap on a
                                              # second machine; nothing re-interpreted, no gate touched
    authorized_by: "carries out owner §1's instruction to report both intervals honestly"
    artifact: experiments/manifests/v3/V3-D001_fullproc_500rep_fly122.json
    artifact_sha256: 5e7e117f28424e616a14ad47319b8ea5f7043b4f21af8c1ce11555c5d9990215
    changes:
      - >
        The level-2 (full-procedure) interval that §1 requires to be reported alongside the fixed-OOF
        interval now has an independent replication on the formal node: 500 replicates on fly122
        (16 cores, 15 workers) give dAUPRC mean +0.11118, 95% CI [-0.02427, +0.23934], sign
