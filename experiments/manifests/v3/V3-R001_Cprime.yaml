root_cause:
  determination: "Case B - the server-side timeout IS transmitted; the server-side lifecycle can
                  nevertheless leave a Lean computation occupying a reusable REPL after the client
                  has classified the attempt"
  case_a_refuted_by: >
    The attempt-1 verifier window contains exactly one enforcement line,
    '[442176bd] Lean REPL command timed out in 120.0 seconds' (2026-09-25T01:42:43.931Z, repl.py:227)
    plus its paired 'Closing REPL 442176bd'. 120.0 is the client's transmitted frozen budget, not the
    server default 300 s; a never-transmitted value cannot appear in that message.
  case_b_evidence: >
    Snippet 50-1 ran on REPL 3062bfa7 from 02:03:47.681Z to 02:12:16.801Z = 509.1 s with no timeout
    line and no Closing line for that REPL, while the client's bound was 180 s (120 + 60). Its two
    isolation retries then returned in 18.4 s and 0.16 s on other REPLs.
  window_log:
    path_on_fly122: /tmp/r001_window_0925.log
    bytes: 172895219
    window_utc: "2026-09-25T01:03:56 -> 03:22:13"
    http_429_count: 0
    snippet_runs: 394
    distinct_repl_ids: 9
    repl_pool_size: 16
  audit_fields:
    client_timeout_s: 180.0          # server_timeout + client_slack
    server_timeout_s: 120.0          # payload["timeout"], always sent
    retry_count: "batch 1 + isolation 1+max_single_retries(2) = 3; a server-confirmed timeout is
                  final and is not retried"
    retry_delay_s: 2.0               # canary backoff 5.0 s
    request_payload_field: "timeout (int seconds), kimina.py:100-101 / kimina.py:147-148"
    server_interpretation: "VerifyRequestBody.timeout (default 300) -> prep header import +
                            repl.send_timeout = asyncio.wait_for(send, timeout); on expiry the REPL
                            is destroyed (SIGKILL) and the item reports 'Lean REPL command timed
                            out in N seconds'. /verify has no client-disconnect handling
                            (backward_router.py:29-37), unlike /api/check (check_router.py:187-191)."

cprime:
  invariant: >
    No candidate verification attempt may leave a Lean computation occupying a reusable REPL after
    that attempt is classified timed out/failed; capacity is restored before the next candidate.
  changes:
    - id: dedicated-instance
      what: "infra/lean-server/r001/compose.yaml - container tinylean-rl-lean-server-r001,
             127.0.0.1:8010 only, image pinned projectnumina/kimina-lean-server:2.0.0
             (sha256:588a2cbb...3ffd9, pull_policy: never), LEAN_SERVER_MAX_REPLS=1,
             LEAN_SERVER_MAX_REPL_USES=-1, LEAN_SERVER_MAX_REPL_MEM=8G, LEAN_SERVER_MAX_WAIT=60,
             16 GiB container cap with swap disabled, subnet 10.202.0.0/24"
      guard: "VerifierRecovery.verify_identity() - fail-closed preflight: the endpoint must be THIS
              container (pinned image, MAX_REPLS=1, its published port)"
    - id: verification-concurrency
      what: "FROZEN_SETTINGS.VERIFIER.batch_size 4 -> 1 (the only frozen-settings change)"
      rationale: "one candidate per request against a singleton REPL; batch>1 would race the single
                  slot into 429s, and per-candidate sequencing preserves verdicts through a
                  mid-group fail-close"
    - id: mandatory-recovery
      what: "after ANY non-conclusive classification: docker restart -t 10 -> /health poll ->
             nonformal cold canary (first_timeout_s budget) -> next candidate; bounded by
             max_recoveries_per_run=16; fail-closed (abort with aborted-summary + resume)"
      note: "restart = infrastructure recovery, NOT a candidate retry; the frozen attempt budget is
             untouched; VerifierUnhealthyError no longer ends the run by itself"
  rejected_alternative: >
    Switching to /api/check would give server-side disconnect cleanup but changes the frozen
    decode/taxonomy path - out of C' scope; recorded as rejected.
  short_circuit_review_owner_section_7: >
    Review only, NOT implemented: after a permanent INFRA_CENSORED a skip of the group's remaining
    candidates would change no endpoint/no gate/no label, i.e. it is a compute-only optimization -
    but it changes which events exist, so it requires its own pre-outcome amendment and owner
    authorization before it could be used.

