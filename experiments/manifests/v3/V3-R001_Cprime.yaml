#
# Companion to docs/v3/V3-R001_infrastructure_amendment_Cprime.md. This is an
# INFRASTRUCTURE amendment made after attempt-1 aborted (2026-09-25) and before
# any attempt-2 generation. It changes no scientific setting; the single moved
# FROZEN_SETTINGS entry is verification concurrency (batch_size 4 -> 1), recorded
# below with its rationale. Owner authority: directive of 2026-09-25, sections 1-16.
