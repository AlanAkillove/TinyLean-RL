authority: >
  Owner directive 2026-09-25 (sections 1-16) after V3-R001 attempt-1 aborted three times on a
  verifier-lifecycle fault: fix the lifecycle itself (section 1), audit before changing anything
  (section 2), enforce the capacity invariant client-side (section 3), do not lengthen the frozen
  server-side candidate timeout (section 4), prefer a dedicated single-REPL verifier instance
  (section 5), mandate bounded fail-closed recovery (section 6), review - do not implement - the
  censored-group short-circuit (section 7), validate on nonformal inputs before touching R001
  (sections 8-9), freeze this document and the manifest (section 10).

