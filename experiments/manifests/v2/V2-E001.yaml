result_summary: >
  SINGLE-CANDIDATE PATH: PASS. Direct-budget generations are token-identical
  to the 4096-run prefix for every b in {512,1024,2048,3072}, and same-seed
  reruns are token-identical (32/32 determinism + 160/160 prefix checks over
  16 theorems x 2 seeds). Prefix-derived (cheap) budget labels are therefore
  VALID for B2 on this path. HF batch=4: internally self-consistent
  (determinism 4/4, prefix 4/4) but token streams differ from the
  single-candidate path; usable for B2 only with an explicit engine-semantics
  statement plus re-verification at the chosen batch composition. vLLM 0.9.1:
  FAIL (same-config reruns diverge) - not usable for budget-response
  construction. Natural-completion (EOS) rate of the 4096 runs: 9/32; no
  trajectory stopped before 1508 tokens. Cost: 343,895 generated tokens in
  12,571 s generation time (single path, RTX 3080 10GB) - throughput input
  for B2 sizing.

status_note: >
