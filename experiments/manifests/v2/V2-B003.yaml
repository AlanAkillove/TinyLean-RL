  Preregistered 2026-09-20 WHILE B002 is running and its results are unknown -
  the B003 design must not be contaminated by B002 outcomes. The runner
  (scripts/v2_b003_generate.py) and analyzer (scripts/v2_b003_analyze.py) are
  implemented during the B002 run and committed with tests BEFORE any B003
