# Canonical V2 experiment registry.
#
# Naming amendment (2026-09-19): new formal experiments use track-specific
# namespaces - V2-A### (Track A, RL prover / fly90), V2-B### (Track B, adaptive
# allocator / fly122), V2-C### (Track C, joint evaluation / fly90). The
# pre-amendment shared namespace "V2-E###" is closed for new experiments.
# Official raw identifiers are never rewritten; aliases are registered here
# permanently. This file is append-only for aliases and experiment entries.
#
# Manifests are still created before the run and frozen per their own
# freeze_rule (see README.md).

registry:
  amended_at_utc: "2026-09-19"
  namespaces:
    V2-A###: {track: A, owner: fly90, scope: "RL prover line ending in frozen theta_RL*"}
    V2-B###: {track: B, owner: fly122, scope: "adaptive compute allocator"}
    V2-C###: {track: C, owner: fly90, scope: "joint prover x allocation evaluation"}

aliases:
  # raw id used before the naming amendment -> canonical track-scoped id
  V2-E001:
    canonical: V2-B001
    title: "Budget-semantics audit - direct-budget vs 4096-prefix equivalence for theta0"
    owner: fly122
    status: COMPLETE
    manifest: "experiments/manifests/v2/V2-E001.yaml (raw id kept; source: fly122 worker/v2-allocator f03ebba; results adcb52a)"
    note: >
      Preregistered and launched by fly122 on the pre-amendment main2 (ca804f1).
      The raw identifier V2-E001 and every artifact keep their original names;
      V2-B001 is the canonical track-scoped alias for all future references.
      The published usage_note reserves its 16-theorem subset as
      B1-audit-reserved in the V2 theorem-role registry.
      Completed 2026-09-19: canonical single-candidate HF path PASS;
      see docs/v2/b1_budget_semantics.md.

experiments:
  V2-B001:
    alias_of: V2-E001
    track: B
    owner: fly122
    status: COMPLETE           # canonical integration 2026-09-20
    note: >
      First B-track experiment (B1 gate). Canonical single-candidate HF
      determinism 32/32; token-prefix exact match 160/160 (token ids;
      16 theorems x 2 seeds, budgets {512,1024,2048,3072} vs the 4096 prefix).
      B1 PASS: prefix-derived budget labels are valid on the canonical path.
      vLLM 0.9.1 does not satisfy this experiment's trajectory-identity
      requirement (same-config reruns diverge) and must not construct
      budget-response datasets. See aliases.V2-E001.
  V2-B002:
    track: B
    owner: fly122
    status: COMPLETE           # canonical integration 2026-09-20 (closeout accepted by owner)
    manifest: experiments/manifests/v2/V2-B002.yaml
    preregistration_history:
      initial_preregistration: a914bd9
      final_pre_launch_amendment: 0a2c798
      launch: ee8c5ef
      concurrency_amendment: 95e741d
      closeout: 224e288
    result: >
      512/512 complete in 6h45m (4-shard parallel after the owner-approved
