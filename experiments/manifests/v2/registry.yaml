# Canonical V2 experiment registry.
#
# Naming amendment (2026-09-19): new formal experiments use track-specific
# namespaces - V2-A### (Track A, RL prover / fly90), V2-B### (Track B, adaptive
# allocator / fly122), V2-C### (Track C, joint evaluation / fly90). The
# pre-amendment shared namespace "V2-E###" is closed for new experiments.
# Official raw identifiers are never rewritten; aliases are registered here
# permanently. This file is append-only for aliases and experiment entries.
#
# Manifests are still created before the run and frozen per their own
# freeze_rule (see README.md).
#
# V2 research freeze (2026-09-23): the V2 exploration formally ended by owner
# decision. Freeze tag: v2-research-freeze-20260923. Successor work continues
# outside V2 from branch v3-jev-rl-controller. The entries below are the final
# V2 record (see docs/v2/v2_closeout.md).

