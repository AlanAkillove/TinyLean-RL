[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinylean-rl"
version = "0.1.0"
description = "Reproducible research environment for sub-billion Lean theorem provers"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "TinyLean-RL contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "huggingface-hub>=0.25,<2",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
inference = [
  "accelerate>=0.34,<2",
  "torch==2.7.0",
  # vllm 0.9.1 registers an "aimv2" AutoConfig unconditionally, which
  # collides with transformers >= 4.54.0 (AIMv2 added upstream); keep the
  # shared inference/training environment below that version.
  "transformers>=4.51.1,<4.54",
]
verifier = ["kimina-client>=0.1,<1"]
probe = [
  "peft>=0.13,<1",
]
data = [
  "datasets>=4,<5",
  "hf-xet>=1,<2",
  "pyarrow>=14,<24",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]
# P3 training stack pinned to the Kimina-Prover-RL matrix (research decision
# D004): the pinned VERL commit allows vllm<=0.9.1, which requires
# torch==2.7.0; torch 2.7.0 default PyPI wheels are the CUDA 12.6 builds and
# flash-attn is installed from the official wheel matching torch 2.7 / cp312 /
# cxx11abiTRUE.
training = [
  "vllm==0.9.1",
  "ray[default]>=2.43.0,<2.49",
  "verl[vllm]",
  "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.0.post2/flash_attn-2.8.0.post2+cu12torch2.7cxx11abiTRUE-cp312-cp312-linux_x86_64.whl",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
verl = { path = "third_party/kimina-prover-rl", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
