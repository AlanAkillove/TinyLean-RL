[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinylean-rl"
version = "0.1.0"
description = "Reproducible research environment for sub-billion Lean theorem provers"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "TinyLean-RL contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "huggingface-hub>=0.25,<2",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
inference = [
  "accelerate>=0.34,<2",
  "torch==2.9.0+cu128",
  "transformers>=4.45,<5",
]
verifier = ["kimina-client>=0.1,<1"]
data = [
  "datasets>=4,<5",
  "hf-xet>=1,<2",
  "pyarrow>=14,<24",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
