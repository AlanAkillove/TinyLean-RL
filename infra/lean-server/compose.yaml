services:
  lean-server:
    image: projectnumina/kimina-lean-server:2.0.0
    container_name: tinylean-rl-lean-server
    restart: unless-stopped
    ports:
      - "${LEAN_SERVER_PORT:-8000}:8000"
    environment:
      LEAN_SERVER_PORT: "8000"
      LEAN_SERVER_LOG_LEVEL: "${LEAN_SERVER_LOG_LEVEL:-INFO}"
      LEAN_SERVER_API_KEY: "${LEAN_SERVER_API_KEY:-}"
