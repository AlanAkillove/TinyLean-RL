services:
  # WARNING: `docker compose up -d` RECREATES the container and wipes its
  # writable layer; the image re-runs its Mathlib initialization on the next
  # start (observed 2026-09-17: ~500% CPU / >25 GiB RSS for tens of minutes,
  # during which every /verify fails with NoAvailableReplError). To change
  # runtime limits, prefer `docker update` (live, no recreate).
  lean-server:
    image: projectnumina/kimina-lean-server:2.0.0
    container_name: tinylean-rl-lean-server
    restart: unless-stopped
    # Cap container memory: pathological candidates (e.g. interval_cases
    # enumeration bombs) can push a single Mathlib REPL past 20 GB and
    # trigger a HOST-wide OOM kill (observed 2026-09-17 07:10 UTC: the kernel
    # killed a 20.4 GB REPL python inside this container, and systemd-oomd
    # picked off user-slice processes, including our evaluation runner).
    # With the cap, the container's own memcg OOM only kills the runaway
    # REPL; the kimina server reports that snippet as an error, the evaluator
    # records it (verifier_error) and continues.
    # Value history: first set to 24 GiB, but the NORMAL warm REPL pool uses
    # 26-30 GiB - lowering the live limit to 24 GiB killed the whole pool
    # (2026-09-17 08:57 UTC, required a re-warm). 40 GiB fits the healthy
    # pool and still bounds explosions far below host capacity (~62 GiB).
    # Do not remove without re-checking host memory behaviour under
    # monster-candidate load.
    mem_limit: 40g
    memswap_limit: 40g
    ports:
      - "${LEAN_SERVER_PORT:-8000}:8000"
    environment:
      LEAN_SERVER_PORT: "8000"
      LEAN_SERVER_LOG_LEVEL: "${LEAN_SERVER_LOG_LEVEL:-INFO}"
      # Pass the key only when it is actually configured: the image treats a
      # present-but-empty LEAN_SERVER_API_KEY as a required key (empty string
      # is not None in pydantic), which makes every request fail with 401.
      LEAN_SERVER_API_KEY:

# Pin the Compose network explicitly. Relying on Docker's automatic subnet
# allocation collided with the campus LAN (172.18.0.0/16) once; never use
# 172.17.0.0/16, 172.18.0.0/16 or the server's own 10.3.25.0/24 here.
networks:
  default:
    ipam:
      config:
        - subnet: 10.201.0.0/24
